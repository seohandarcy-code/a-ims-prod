# 컨테이너용 정적 서빙 전용 설정 (루트의 nginx/nginx.conf와는 별개 파일).
# PDEP이 Host 기반 Ingress로 프론트/백엔드 도메인을 분리한다는 전제라 /api 프록시는 없음.
# 같은 도메인에서 /api를 백엔드로 프록시하는 path 기반 라우팅으로 확정되면
# location /api/ { proxy_pass ...; } 블록을 추가해야 한다.
server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
