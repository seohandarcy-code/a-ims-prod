<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리 우선순위 카드 — 안 A (리스트형 아코디언)</title>
<style>
  :root {
    /* 중립(검정 계열) */
    --text-main: #171717;
    --text-muted: #525252;
    --text-subtle: #A3A3A3;
    --border-color: #E5E5E5;
    --neutral-strong: #171717;
    --neutral-soft: #F5F5F5;
    --page-bg: #F8FAFC;
    --card-bg: #FFFFFF;
    /* 단계색 */
    --stage-po: #1428A0;      --stage-po-soft: #DBEAFE;
    --stage-contract: #7C3AED; --stage-contract-soft: #EDE9FE;
    --stage-execution: #059669; --stage-execution-soft: #D1FAE5;
    /* 형태 */
    --card-radius: 1rem;
    --card-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem;
    background: var(--page-bg);
    font-family: "Pretendard", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
  }
  .panel { max-width: 560px; }
  .panel-title { font-size: 1.15rem; font-weight: 750; margin: 0 0 0.15rem; letter-spacing: -0.02em; }
  .panel-desc { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 1rem; }

  /* 5개 남짓 보이고 넘치면 스크롤 */
  .card-scroll {
    max-height: 520px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 0.6rem;
    padding-right: 0.25rem;
  }
  .card-scroll::-webkit-scrollbar { width: 8px; }
  .card-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 999px; }

  .p-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .p-card:hover { border-color: #d4d4d4; box-shadow: 0 2px 8px rgba(15,23,42,0.08); }
  .p-card.open { border-color: var(--text-subtle); }

  .p-head {
    display: grid;
    grid-template-columns: 2.2rem 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
  }
  .rank {
    font-size: 1.05rem; font-weight: 800; color: var(--text-subtle);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .head-main { min-width: 0; }
  .title-line { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-line { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.15rem; }
  .meta-line .dot { color: var(--text-subtle); margin: 0 0.35rem; }
  .no-chip { color: var(--text-subtle); font-variant-numeric: tabular-nums; }

  .head-right { display: flex; align-items: center; gap: 0.5rem; }
  .stage-badge {
    padding: 0.18rem 0.55rem; border-radius: 0.45rem;
    font-size: 0.74rem; font-weight: 700; white-space: nowrap;
  }
  .chevron { color: var(--text-subtle); transition: transform .18s ease; font-size: 0.7rem; }
  .p-card.open .chevron { transform: rotate(180deg); }

  /* 단계색 배지 (soft 배경 + 진한 글자) */
  .s-po       { background: var(--stage-po-soft);        color: var(--stage-po); }
  .s-contract { background: var(--stage-contract-soft);  color: var(--stage-contract); }
  .s-execution{ background: var(--stage-execution-soft); color: var(--stage-execution); }

  /* 확장 영역 */
  .p-detail {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .2s ease;
  }
  .p-card.open .p-detail { grid-template-rows: 1fr; }
  .p-detail-inner { overflow: hidden; }
  .detail-body {
    border-top: 1px dashed var(--border-color);
    margin: 0 1rem; padding: 0.8rem 0 0.9rem;
    display: grid; gap: 0.7rem;
  }
  .detail-row { display: grid; grid-template-columns: 5.2rem 1fr; gap: 0.6rem; align-items: start; }
  .detail-key { font-size: 0.73rem; font-weight: 700; color: var(--text-subtle); padding-top: 0.05rem; }
  .detail-val { font-size: 0.82rem; color: var(--text-main); line-height: 1.45; }
  .detail-val.action { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="panel">
    <h1 class="panel-title">관리 우선순위</h1>
    <p class="panel-desc">안 A · 리스트형 아코디언 — 카드를 클릭하면 진단내용/관리포인트가 아래로 펼쳐집니다.</p>
    <div class="card-scroll" id="scroll"></div>
  </div>

  <script>
    const rows = [
      { no: 12, org: '시스템_PJT',   owner: '김도윤', title: '차세대 관제 시스템 구축', stage: '품의 지연', cls: 's-po',        detail: '팀장심의예정 5월 경과 후 품의 미완료', action: '심의 의견/보완 필요사항 확인' },
      { no: 27, org: '자동화_PJT',   owner: '이서준', title: '스마트 물류 자동화 라인', stage: '품의 지연', cls: 's-po',        detail: '팀장심의예정 4월 경과 후 품의 미완료', action: '센터장 심의 필요 여부 재확인' },
      { no: 8,  org: '인프라DT_PJT', owner: '박지우', title: '데이터센터 냉각 효율화',   stage: '계약 대기', cls: 's-contract',  detail: '품의완료 후 계약등록 미완료 (2개월 경과)', action: '계약등록 예정월/구매 진행상태 확인' },
      { no: 31, org: '시스템_PJT',   owner: '최민서', title: '통합 보안관제 고도화',     stage: '계약 대기', cls: 's-contract',  detail: '품의완료 후 계약등록 미완료', action: '구매팀 발주 일정 협의' },
      { no: 15, org: '자동화_PJT',   owner: '정하윤', title: 'AGV 무인운반 도입',        stage: '집행 대기', cls: 's-execution', detail: '품의/계약 이후 기준월까지 집행금액 미발생', action: '기성단계·검수·세금계산서 처리 상태 확인' },
      { no: 4,  org: '인프라DT_PJT', owner: '강도현', title: '네트워크 이중화 구축',     stage: '집행 대기', cls: 's-execution', detail: '계약 후 3개월 집행 미발생', action: '착수보고/선급금 지급 여부 점검' },
      { no: 22, org: '시스템_PJT',   owner: '윤서아', title: 'ERP 정산모듈 고도화',      stage: '잔여 집행', cls: 's-execution', detail: '잔여 집행금액 4.2억', action: '잔여 기성단계와 월별 집행예측 점검' },
    ];
    const scroll = document.getElementById('scroll');
    rows.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'p-card';
      card.innerHTML = `
        <div class="p-head">
          <div class="rank">${i + 1}</div>
          <div class="head-main">
            <div class="title-line">${r.title}</div>
            <div class="meta-line">
              <span class="no-chip">NO ${r.no}</span><span class="dot">·</span>${r.org}<span class="dot">·</span>${r.owner}
            </div>
          </div>
          <div class="head-right">
            <span class="stage-badge ${r.cls}">${r.stage}</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="p-detail"><div class="p-detail-inner"><div class="detail-body">
          <div class="detail-row"><div class="detail-key">진단내용</div><div class="detail-val">${r.detail}</div></div>
          <div class="detail-row"><div class="detail-key">관리포인트</div><div class="detail-val action">${r.action}</div></div>
        </div></div></div>`;
      card.addEventListener('click', () => card.classList.toggle('open'));
      scroll.appendChild(card);
    });
  </script>
</body>
</html>
