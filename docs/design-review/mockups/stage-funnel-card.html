<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>StageFunnelCard mockup</title>
<style>
  :root {
    --stage-po-color: #1428A0;
    --stage-contract-color: #7C3AED;
    --stage-execution-color: #059669;
    --page-bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border-color: #E2E8F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem;
    background: var(--page-bg);
    font-family: "Pretendard", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 1rem;
  }
  .funnel-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
    max-width: 1100px;
  }
  .funnel-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 1rem;
    padding: 1.3rem 1.4rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  .funnel-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .funnel-value-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .funnel-pct {
    font-size: 2.3rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .funnel-fraction {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .funnel-track {
    width: 100%;
    height: 0.65rem;
    background: #E2E8F0;
    border-radius: 999px;
    overflow: hidden;
  }
  .funnel-fill {
    height: 100%;
    border-radius: 999px;
  }
  .po .funnel-pct { color: var(--stage-po-color); }
  .po .funnel-fill { background: var(--stage-po-color); }
  .contract .funnel-pct { color: var(--stage-contract-color); }
  .contract .funnel-fill { background: var(--stage-contract-color); }
  .execution .funnel-pct { color: var(--stage-execution-color); }
  .execution .funnel-fill { background: var(--stage-execution-color); }
</style>
</head>
<body>
  <h1>StageFunnelCard 목업 — 품의(블루) → 계약(퍼플) → 집행(그린)</h1>
  <div class="funnel-row">
    <div class="funnel-card po">
      <div class="funnel-label">품의 대상 → 품의 완료</div>
      <div class="funnel-value-row">
        <span class="funnel-pct">73.5%</span>
        <span class="funnel-fraction">25/34건</span>
      </div>
      <div class="funnel-track"><div class="funnel-fill" style="width: 73.5%"></div></div>
    </div>
    <div class="funnel-card contract">
      <div class="funnel-label">품의 완료 → 계약 등록</div>
      <div class="funnel-value-row">
        <span class="funnel-pct">72.0%</span>
        <span class="funnel-fraction">18/25건</span>
      </div>
      <div class="funnel-track"><div class="funnel-fill" style="width: 72.0%"></div></div>
    </div>
    <div class="funnel-card execution">
      <div class="funnel-label">계약 등록 → 집행 발생</div>
      <div class="funnel-value-row">
        <span class="funnel-pct">138.9%</span>
        <span class="funnel-fraction">25/18건</span>
      </div>
      <div class="funnel-track"><div class="funnel-fill" style="width: 100%"></div></div>
    </div>
  </div>
</body>
</html>
