[alembic]
script_location = alembic
prepend_sys_path = .

# The real connection string is filled in by alembic/env.py from
# app.config.DATABASE_URL at runtime (not hardcoded here, so switching
# stage 1 sqlite -> stage 2 postgresql never touches this file, and no
# credential ends up committed to it). Keep this file ASCII-only - on
# Windows, alembic's configparser reads it using the OS locale encoding
# (e.g. cp949), which breaks on non-ASCII bytes.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
